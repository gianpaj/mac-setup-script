# /etc/autosuspend.conf
#
# Suspend this headless box after 15 minutes without monitored activity.
#
# How it works: every `interval` seconds each enabled check answers one
# question -- "is the system busy?". The moment ANY check says yes, the idle
# clock resets to zero. Only after every check has said no continuously for
# `idle_time` seconds does `suspend_cmd` run.
#
# Docs: man autosuspend.conf, or /usr/share/doc/autosuspend/html/index.html

[general]
interval = 30
idle_time = 900
suspend_cmd = /usr/bin/systemctl suspend
wakeup_cmd = sh -c 'echo 0 > /sys/class/rtc/rtc0/wakealarm && echo {timestamp:.0f} > /sys/class/rtc/rtc0/wakealarm'
woke_up_file = /run/autosuspend-just-woke-up
lock_file = /var/lock/autosuspend.lock
lock_timeout = 30


# --- CPU ---------------------------------------------------------------------
# 12 cores, so load-5 of 1.0 is roughly "one core has been pegged for a while".
# An genuinely idle system here sits around 0.05.
[check.Load]
enabled = true
threshold = 1.0


# --- GPU ---------------------------------------------------------------------
# ExternalCommand treats exit code 0 as "busy". See the script for the rule.
[check.Gpu]
class = ExternalCommand
enabled = true
command = /usr/local/bin/autosuspend-gpu-busy


# --- Network throughput ------------------------------------------------------
# Measured idle chatter on enp12s0 is a few KB/s, so 50 KB/s is the floor for
# "something is really transferring". Raising this makes the box sleep more
# eagerly; lowering it towards the 100 B/s default means it never sleeps.
[check.Network]
class = NetworkBandwidth
enabled = true
interfaces = enp12s0, tailscale0
threshold_send = 50000
threshold_receive = 50000


# --- Someone is connected ----------------------------------------------------
# Connections on 11434 (Ollama) or 443 (Tailscale serve) prevent suspend.
# Open SSH connections alone do not prevent suspend.
[check.Connections]
class = ActiveConnection
enabled = true
ports = 11434, 443


# --- Jobs that must not be interrupted ---------------------------------------
# Package operations can sit near-idle on CPU but must never be cut off.
# Matching is on the truncated process name, so do NOT add "unattended-upgr":
# unattended-upgrade-shutdown runs permanently and would pin the box awake
# forever. A real unattended upgrade shells out to dpkg, which is covered here.
[check.Jobs]
class = Processes
enabled = true
processes = apt, apt-get, dpkg, rsync


# Active Codex turns and new session updates reset the idle timer.
# Includes remote clients attached to this app-server; idle open chats do not.
[check.Codex]
class = ExternalCommand
enabled = true
command = /usr/local/bin/autosuspend-codex-busy --socket /home/gianpaj/.codex/app-server-control/app-server-control.sock
